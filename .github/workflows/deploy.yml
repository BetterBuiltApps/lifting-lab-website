name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # The how-to guides are a separate Astro build, copied into site/dist/help.
      - "help/**"
      # site/src/styles.css @imports these, so a token edit changes the built
      # CSS without touching anything under site/. Without this line the deploy
      # silently never fires for a colour or type change.
      - "tokens/**"
      # The release flag and its guard change what a build contains.
      - "tools/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Scoped to site/src on purpose. components/, guidelines/, ui_kits/ and
  # _ds_bundle.js are not in the Vite build, and including them reports on code
  # that never ships. The detector exits 2 on a finding and 0 when clean, and
  # site/src is clean today, so this blocks rather than merely reporting.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: an unpinned detector means a new rule in a future release can
      # fail a deploy of a commit that did not change anything.
      - name: Design detector
        run: npx --yes impeccable@3.5.0 detect site/src

  build:
    needs: quality
    runs-on: ubuntu-latest
    env:
      # The release flag (tools/release.mjs, RELEASING.md): which app version the site and the guides describe.
      # Unset means the default, what is live in the App Store. To release, set the repository variable APP_RELEASE
      # to the new version and run this workflow ("Run workflow").
      APP_RELEASE: ${{ vars.APP_RELEASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Impeccable needs 22.12+. The site itself builds on 20, but keeping
          # one version across both jobs avoids a split that only shows up when
          # someone adds a tool to the wrong job.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            help/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        run: npm run build
      # The guides are served at liftinglab.app/help/ (astro base: /help), so
      # their build output is copied under the site's dist after the site build.
      - name: Install help dependencies
        working-directory: help
        run: npm ci
      - name: Build help
        working-directory: help
        run: npm run build
      - name: Add help to the site
        run: |
          mkdir -p site/dist/help
          cp -R help/dist/. site/dist/help/
      # Fails the deploy if content for a release that has not been reached is anywhere in the output.
      - name: Release guard
        run: node tools/release-guard.mjs
      - name: Record the release
        run: echo "Built for APP_RELEASE=${APP_RELEASE:-default (live)}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
