<!-- @dsCard group="Components" viewport="700x400" name="Data display" subtitle="StatCard, BigNumberCard, ScoreRing, PhaseTimeline, VelocityChart, Sparkline, PlateDiagram" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px}.g{display:grid;gap:12px}.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.c2{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { StatCard, BigNumberCard, ScoreRing, PhaseTimeline, VelocityChart, Sparkline, PlateDiagram, Card, SectionLabel } = window.OWLDesignSystem_875173;
const phases=[{kind:'firstPull',label:'First pull',duration:0.62,peakVelocity:0.95,start:0,end:0.62},{kind:'transition',label:'Transition',duration:0.18,peakVelocity:0.81,start:0.62,end:0.80},{kind:'secondPull',label:'Second pull',duration:0.24,peakVelocity:1.78,start:0.80,end:1.04},{kind:'turnover',label:'Turnover',duration:0.21,peakVelocity:1.12,start:1.04,end:1.25},{kind:'catch',label:'Catch',duration:0.30,peakVelocity:0.2,start:1.25,end:1.55}];
const samples=Array.from({length:80},(_,i)=>{const t=i/80*1.55;const v=t<0.62?0.55+t*0.6:t<0.8?0.95-(t-0.62)*0.8:t<1.04?0.81+(t-0.8)*4:t<1.25?1.78-(t-1.04)*3.2:Math.max(0.05,1.1-(t-1.25)*3.5);return{time:t,velocity:v}});
function Demo(){const [t,setT]=React.useState(0.92);return <div className="g">
<div className="c3"><StatCard value="12.4t" label="Wk Tonnage"/><StatCard value="3/4" label="Sessions"/><StatCard value="Peak" label="Phase" accent="var(--amber)"/></div>
<ScoreRing total={86} grade="A" straightness={0.92} smoothness={0.78}/>
<div className="c2"><PhaseTimeline phases={phases} insight="Smooth transition — only 8% velocity loss."/><div className="g"><VelocityChart samples={samples} phases={phases} currentTime={t} onSeek={setT} height={110}/><BigNumberCard number="1.78" unit="m/s" caption="Peak bar speed"/></div></div>
<div className="c2"><Card padding={14}><SectionLabel>Snatch</SectionLabel><div style={{marginTop:8}}><Sparkline values={[88,92,92,96,99,102]} width={280} height={40}/></div></Card><Card padding={14}><SectionLabel>Per side · 122.5 kg</SectionLabel><PlateDiagram perSide={[{kg:25,count:2},{kg:5,count:1},{kg:1.5,count:1}]} height={90}/></Card></div>
<ScoreRing/>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
