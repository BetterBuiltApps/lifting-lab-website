<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;font:var(--type-body)}.r{display:flex;gap:12px;align-items:center}.bx{border-radius:16px;padding:16px;font:var(--type-caption);color:var(--text-secondary);flex:1}</style></head><body><div class="r"><div class="bx" style="background:var(--bg);border:1px solid var(--hairline)">bg #1A1A1A<br>screen</div><div class="bx" style="background:var(--surface)">surface #232323<br>cards, rows</div><div class="bx" style="background:var(--surface-elevated)">elevated #2C2C2E<br>tracks, capsules</div><div class="bx" style="background:var(--surface-elevated);border:var(--border-accent-1);box-shadow:var(--shadow-toast);flex:none">toast<br>the only shadow</div></div></body></html>
