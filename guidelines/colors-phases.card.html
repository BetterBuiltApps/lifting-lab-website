<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;font:var(--type-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:grid;gap:6px;width:120px}.chip{height:56px;border-radius:12px}.n{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-secondary)}.h{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}.bar{display:flex;gap:1px;height:10px;margin-bottom:12px}.bar div{border-radius:2px}</style></head><body><div class="bar"><div style="flex:.62;background:var(--phase-first-pull)"></div><div style="flex:.18;background:var(--phase-transition)"></div><div style="flex:.24;background:var(--phase-second-pull)"></div><div style="flex:.21;background:var(--phase-turnover)"></div><div style="flex:.30;background:var(--phase-catch)"></div></div><div class="sw"><div class="s"><div class="chip" style="background:#5AC8FA"></div><div class="n">first pull</div><div class="h">#5AC8FA</div></div><div class="s"><div class="chip" style="background:#AF52DE"></div><div class="n">transition</div><div class="h">#AF52DE</div></div><div class="s"><div class="chip" style="background:#F5A623"></div><div class="n">second pull</div><div class="h">#F5A623</div></div><div class="s"><div class="chip" style="background:#34C759"></div><div class="n">turnover</div><div class="h">#34C759</div></div><div class="s"><div class="chip" style="background:#E5E5EA"></div><div class="n">catch</div><div class="h">#E5E5EA</div></div></div></body></html>
