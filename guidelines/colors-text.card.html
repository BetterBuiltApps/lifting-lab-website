<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;font:var(--type-body)}.r{display:grid;gap:8px}.l{display:flex;align-items:baseline;gap:12px}.t{font:var(--type-body)}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);margin-left:auto}</style></head><body><div class="r"><div class="l"><span class="t" style="color:var(--text-primary)">Primary — every number and title</span><span class="k">#FFF</span></div><div class="l"><span class="t" style="color:var(--text-secondary)">Secondary — captions, labels, supporting copy</span><span class="k">60%</span></div><div class="l"><span class="t" style="color:var(--text-tertiary)">Tertiary — dimmest readable tier, ~5:1 on surface</span><span class="k">50%</span></div><div class="l"><span class="t" style="color:var(--glyph-decorative)">Decorative — chevrons, inactive dots. Never body text.</span><span class="k">35%</span></div><div class="l"><span class="t" style="color:var(--cool)">Cool — the second series in Compare</span><span class="k">#5AC8FA</span></div></div></body></html>
