<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;font:var(--type-body)}.r{display:grid;gap:12px}.b{height:52px;border-radius:14px;background:var(--amber);color:#000;display:grid;place-items:center;font:var(--type-headline);animation:pop 1.6s var(--ease-pop) infinite}@keyframes pop{0%,55%,100%{transform:scale(1)}70%{transform:scale(.93)}}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}.tr{height:8px;border-radius:999px;background:var(--surface-elevated);overflow:hidden}.tr>i{display:block;height:100%;border-radius:999px;background:var(--gradient-progress);animation:fill 2.4s var(--ease-spring) infinite alternate}@keyframes fill{from{width:12%}to{width:92%}}</style></head><body><div class="r"><div class="b">Press → scale(0.93)</div><div class="tr"><i></i></div><span class="k">--ease-spring cubic-bezier(.34,1.42,.64,1) · --duration-spring 350ms</span></div></body></html>
