<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;font:var(--type-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:grid;gap:6px;width:120px}.chip{height:56px;border-radius:12px}.n{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-secondary)}.h{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}.g{height:56px;border-radius:12px}</style></head><body><div class="sw"><div class="s"><div class="chip" style="background:#F5A623"></div><div class="n">amber</div><div class="h">#F5A623</div></div><div class="s"><div class="chip" style="background:#FFC74D"></div><div class="n">amber-light</div><div class="h">#FFC74D</div></div><div class="s"><div class="chip" style="background:rgba(245,166,35,0.16)"></div><div class="n">amber 16%</div><div class="h">rgba(…,.16)</div></div><div class="s"><div class="chip" style="background:var(--gradient-amber)"></div><div class="n">gradient-amber</div><div class="h">#FFC74D → #F5A623</div></div><div class="s"><div class="chip" style="background:var(--amber);display:grid;place-items:center;font:var(--type-headline);color:#000">Start</div><div class="n">on-amber</div><div class="h">#000000</div></div></div></body></html>
