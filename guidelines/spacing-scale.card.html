<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;font:var(--type-body)}.r{display:grid;gap:6px}.l{display:flex;align-items:center;gap:10px}.b{height:14px;background:var(--amber);border-radius:2px}.k{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);width:130px}</style></head><body><div class="r"><div class="l"><span class="k">--space-tight 8</span><span class="b" style="width:48px"></span></div><div class="l"><span class="k">--space-normal 12</span><span class="b" style="width:72px"></span></div><div class="l"><span class="k">--space-5 14</span><span class="b" style="width:84px"></span></div><div class="l"><span class="k">--space-6 16</span><span class="b" style="width:96px"></span></div><div class="l"><span class="k">--space-loose 20</span><span class="b" style="width:120px"></span></div><div class="l"><span class="k">--space-7 24</span><span class="b" style="width:144px"></span></div></div></body></html>
