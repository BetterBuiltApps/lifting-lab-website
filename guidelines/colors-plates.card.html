<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;font:var(--type-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{display:grid;gap:6px;width:120px}.chip{height:56px;border-radius:12px}.n{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-secondary)}.h{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}.pl{display:flex;align-items:center;gap:2px;height:90px;margin-bottom:10px}.pl i{border-radius:3px;border:.5px solid rgba(0,0,0,.25);display:block}</style></head><body><div class="pl"><span style="width:40px;height:10px;background:var(--bar-steel)"></span><span style="width:8px;height:32px;background:rgba(142,142,147,.9);border-radius:2px"></span><i style="width:22px;height:90px;background:var(--plate-25)"></i><i style="width:22px;height:90px;background:var(--plate-25)"></i><i style="width:20px;height:90px;background:var(--plate-20)"></i><i style="width:18px;height:90px;background:var(--plate-15)"></i><i style="width:14px;height:90px;background:var(--plate-10)"></i><i style="width:11px;height:65px;background:var(--plate-5)"></i><i style="width:8px;height:50px;background:var(--plate-2-5)"></i><i style="width:6px;height:40px;background:var(--plate-1-5)"></i></div><div class="sw"><div class="s"><div class="chip" style="background:#D93333"></div><div class="n">25 kg</div><div class="h">#D93333</div></div><div class="s"><div class="chip" style="background:#336BD9"></div><div class="n">20 kg</div><div class="h">#336BD9</div></div><div class="s"><div class="chip" style="background:#F2CC33"></div><div class="n">15 kg</div><div class="h">#F2CC33</div></div><div class="s"><div class="chip" style="background:#40B359"></div><div class="n">10 kg</div><div class="h">#40B359</div></div><div class="s"><div class="chip" style="background:#EBEBEB"></div><div class="n">5 kg</div><div class="h">#EBEBEB</div></div></div></body></html>
