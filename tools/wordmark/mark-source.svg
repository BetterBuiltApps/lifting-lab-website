<!-- Source drawing for the flask and barbell mark.

     This is the previous logo lockup, kept verbatim because the path with
     id="path1-4" is the only place the mark exists in a form the build can
     use. The artist's file (Logo/lifting-lab.svg, outside this repo) draws
     its wordmark as live text inside an SVG 2 shape-inside flow region, which
     no browser implements.

     assemble.py reads path1-4 out of here and ignores everything else, so the
     dead wordmark paths below are historical record, not output. Nothing in
     site/ loads this file. -->
