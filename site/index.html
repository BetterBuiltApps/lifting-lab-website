<!-- Absolute URLs, not %BASE_URL%: a scraper has no page context to resolve a
     relative path against, and a relative og:image is the usual reason a link
     unfurls as a bare title. The card is generated by tools/wordmark/social.py
     from the same logo.svg, so it cannot drift from the wordmark. -->
